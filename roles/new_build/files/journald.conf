[Journal]
Storage=persistent

# Total disk space the journal can use
SystemMaxUse=1G

# Keep at least this much free space on the filesystem
SystemKeepFree=1G

# Max size of a single journal file before rotation
SystemMaxFileSize=100M

# Max number of individual journal files to keep
SystemMaxFiles=10

# Time-based retention (delete entries older than this)
MaxRetentionSec=1month

# Don't keep entries newer than this if space is needed sooner
MaxFileSec=1week